<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiDAR Ready Particle System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --hud-bg: rgba(2, 14, 7, 0.46);
            --hud-glass: rgba(4, 28, 14, 0.5);
            --hud-module: rgba(6, 34, 17, 0.56);
            --hud-border: rgba(90, 255, 165, 0.85);
            --hud-border-dim: rgba(40, 133, 80, 0.75);
            --hud-text: #8fffb9;
            --hud-text-dim: #4bc47c;
            --hud-track: #10321d;
            --hud-glow: rgba(90, 255, 165, 0.34);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            color: var(--hud-text);
            font-family: 'Rajdhani', monospace;
            background:
                radial-gradient(circle at 84% 18%, rgba(43, 255, 142, 0.1), transparent 30%),
                linear-gradient(180deg, #020703 0%, #010401 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(60, 255, 149, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(60, 255, 149, 0.045) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.28;
            z-index: 1;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(132, 255, 189, 0.03) 0px,
                rgba(132, 255, 189, 0.03) 2px,
                transparent 2px,
                transparent 6px
            );
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #ui-panel {
            position: absolute;
            z-index: 3;
            top: 12px;
            right: 12px;
            width: min(400px, calc(100vw - 24px));
            height: min(70vh, 540px);
            padding: 6px;
            background: var(--hud-bg);
            border: 1px solid var(--hud-border);
            box-shadow: 0 0 0 1px rgba(17, 78, 45, 0.9), 0 0 20px var(--hud-glow), inset 0 0 18px rgba(22, 110, 63, 0.2);
            backdrop-filter: blur(2px);
            clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

        .hud-shell {
            display: grid;
            grid-template-columns: 74px 1fr;
            gap: 6px;
            height: 100%;
        }

        .tab-strip {
            background: var(--hud-glass);
            border: 1px solid var(--hud-border-dim);
            padding: 5px;
            display: grid;
            gap: 4px;
            align-content: start;
            overflow-y: auto;
        }

        .tab-btn {
            border: 1px solid var(--hud-border-dim);
            background: linear-gradient(180deg, rgba(8, 55, 30, 0.88), rgba(5, 28, 15, 0.88));
            color: var(--hud-text-dim);
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            letter-spacing: 0.6px;
            line-height: 1.2;
            text-transform: uppercase;
            padding: 6px 3px;
            text-align: center;
            cursor: pointer;
            min-height: 34px;
            transition: box-shadow 0.16s ease, color 0.16s ease, border-color 0.16s ease;
        }

        .tab-btn:hover {
            border-color: var(--hud-border);
            color: var(--hud-text);
            box-shadow: 0 0 10px rgba(60, 255, 149, 0.2);
        }

        .tab-btn.active {
            border-color: var(--hud-border);
            color: var(--hud-text);
            box-shadow: inset 0 0 10px rgba(60, 255, 149, 0.2), 0 0 12px rgba(60, 255, 149, 0.32);
        }

        #ui-panel-content {
            background: var(--hud-glass);
            border: 1px solid var(--hud-border-dim);
            padding: 6px;
            display: grid;
            grid-template-rows: auto 78px 1fr auto;
            gap: 6px;
            min-height: 0;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            align-items: center;
        }

        .panel-title {
            margin: 0;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--hud-glow);
        }

        .panel-meta {
            font-family: 'Orbitron', monospace;
            font-size: 8px;
            color: var(--hud-text-dim);
            text-transform: uppercase;
            text-align: right;
            letter-spacing: 0.6px;
            max-width: 54%;
        }

        .preview-window {
            border: 1px solid var(--hud-border);
            background:
                linear-gradient(180deg, rgba(18, 110, 55, 0.08), rgba(7, 44, 22, 0.08)),
                repeating-linear-gradient(0deg, rgba(60, 255, 149, 0.05) 0px, rgba(60, 255, 149, 0.05) 1px, transparent 1px, transparent 7px);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hud-text-dim);
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(60, 255, 149, 0.18);
            font-size: 9px;
        }

        .module-stack {
            min-height: 0;
            overflow: auto;
        }

        .module-panel {
            display: none;
            background: var(--hud-module);
            border: 1px solid var(--hud-border);
            box-shadow: inset 0 0 0 1px rgba(38, 131, 78, 0.58);
            padding: 6px;
            clip-path: polygon(0 8px, 8px 0, 100% 0, 100% 100%, 0 100%);
        }

        .module-panel.active {
            display: block;
        }

        .stack-control {
            margin-bottom: 6px;
        }

        .stack-control:last-child {
            margin-bottom: 0;
        }

        .module-label {
            display: block;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(90, 255, 165, 0.35);
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--hud-text);
        }

        label {
            display: block;
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: var(--hud-text-dim);
            margin-bottom: 3px;
        }

        select,
        button,
        input[type=file],
        .hud-action {
            width: 100%;
            border-radius: 0;
            border: 1px solid var(--hud-border);
            background: linear-gradient(180deg, rgba(7, 58, 30, 0.88), rgba(5, 33, 17, 0.9));
            color: var(--hud-text);
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 6px 7px;
            min-height: 26px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: inset 0 0 0 1px rgba(92, 255, 168, 0.16), 0 0 8px rgba(60, 255, 149, 0.15);
            display: inline-block;
            transition: filter 0.16s ease, box-shadow 0.16s ease, transform 0.08s ease;
            margin-bottom: 5px;
        }

        select,
        input[type=file] {
            font-family: 'Rajdhani', monospace;
            font-size: 15px;
            letter-spacing: 0.4px;
            text-transform: none;
            background: rgba(4, 29, 15, 0.9);
        }

        button:hover,
        .hud-action:hover,
        select:hover,
        input[type=file]:hover {
            filter: brightness(1.1);
            box-shadow: inset 0 0 0 1px rgba(124, 255, 185, 0.32), 0 0 12px rgba(60, 255, 149, 0.34);
        }

        button:active,
        .hud-action:active {
            transform: translateY(1px);
        }

        button.active {
            background: linear-gradient(180deg, rgba(109, 255, 177, 0.95), rgba(40, 140, 80, 0.96));
            color: #042210;
        }

        #drop-zone,
        #video-drop-zone {
            border: 1px dashed var(--hud-border);
            padding: 6px;
            text-align: center;
            font-size: 14px;
            color: var(--hud-text-dim);
            background: rgba(4, 25, 12, 0.52);
        }

        #drop-zone.dragover,
        #video-drop-zone.dragover {
            color: #d4ffe5;
            border-color: #c2ffdb;
            box-shadow: 0 0 10px rgba(98, 255, 172, 0.45);
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border: 1px solid var(--hud-border);
            background: var(--hud-track);
            --fill: 50%;
            margin-bottom: 6px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 6px;
            background: linear-gradient(
                to right,
                #80ffb7 0%,
                #58f8a0 var(--fill),
                #10321d var(--fill),
                #10321d 100%
            );
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #dbffeb;
            background: radial-gradient(circle at 35% 35%, #ecfff4 0%, #65ffaf 55%, #1b8d53 100%);
            margin-top: -4px;
            box-shadow: 0 0 8px rgba(90, 255, 165, 0.7);
        }

        input[type=range]::-moz-range-track {
            height: 6px;
            background: #10321d;
        }

        input[type=range]::-moz-range-progress {
            height: 6px;
            background: linear-gradient(90deg, #80ffb7, #58f8a0);
        }

        input[type=range]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #dbffeb;
            background: radial-gradient(circle at 35% 35%, #ecfff4 0%, #65ffaf 55%, #1b8d53 100%);
            box-shadow: 0 0 8px rgba(90, 255, 165, 0.7);
        }

        #filter-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.2s ease, opacity 0.2s ease;
            margin-top: 6px;
        }

        #filter-panel.open {
            max-height: 260px;
            opacity: 1;
        }

        .hud-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(90, 255, 165, 0.3);
        }

        .hud-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            grid-column: span 2;
        }

        .note {
            margin: 0;
            font-family: 'Rajdhani', monospace;
            font-size: 11px;
            color: var(--hud-text-dim);
            line-height: 1.1;
            grid-column: span 2;
        }

        @media (max-width: 680px) {
            #ui-panel {
                left: 8px;
                right: 8px;
                top: 8px;
                width: auto;
                height: calc(100vh - 16px);
            }

            .hud-shell {
                grid-template-columns: 64px 1fr;
            }

            #ui-panel-content {
                grid-template-rows: auto 72px 1fr auto;
            }

            .panel-meta {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="hud-shell">
        <nav class="tab-strip">
            <button class="tab-btn active" data-target="module-source">SOURCE</button>
            <button class="tab-btn" data-target="module-depth-controls">DEPTH</button>
        </nav>

        <div id="ui-panel-content">
            <div class="panel-head">
                <h3 class="panel-title">Depth Engine HUD</h3>
                <div class="panel-meta">Darius Desir + ALall | Beta</div>
            </div>

            <div class="preview-window">Scanner Feed Active</div>

            <div class="module-stack">
                <div class="module-panel active" id="module-source">
                    <label class="module-label">Source Input</label>
                    <div class="stack-control">
                        <label>Camera Select</label>
                        <select id="cameraSelect">
                            <option value="" disabled selected>Loading cameras...</option>
                        </select>
                        <button id="btn-refresh">Refresh List</button>
                    </div>

                    <div class="stack-control">
                        <label>Image Upload</label>
                        <input type="file" id="imageInput" accept="image/*">
                        <div id="drop-zone">Drop depth image here</div>
                    </div>

                    <div class="stack-control">
                        <label>Video File</label>
                        <input type="file" id="videoInput" accept="video/*">
                        <div id="video-drop-zone">Drop video here (LiDAR)</div>
                    </div>
                </div>

                <div class="module-panel" id="module-depth-controls">
                    <label class="module-label">Depth Processing</label>

                    <div class="stack-control">
                        <label>Interpretation Mode</label>
                        <button id="btn-mode" onclick="toggleMode()">Mode: Simulation (Light)</button>
                    </div>

                    <div class="stack-control">
                        <label>Depth Amplitude</label>
                        <input type="range" id="depth-range" min="0" max="300" value="100">
                    </div>

                    <div class="stack-control">
                        <label>Calibration / Contrast</label>
                        <input type="range" id="contrast-range" min="0" max="2" step="0.1" value="1.0">
                    </div>

                    <div class="stack-control">
                        <button id="btn-filters" type="button">Filters ></button>
                        <div id="filter-panel">
                            <label>Brightness</label>
                            <input type="range" id="brightness-range" min="-1" max="1" step="0.01" value="0">
                            <label>Contrast</label>
                            <input type="range" id="image-contrast-range" min="0" max="3" step="0.01" value="1">
                            <label>Saturation</label>
                            <input type="range" id="saturation-range" min="0" max="3" step="0.01" value="1">
                            <label>Sharpness</label>
                            <input type="range" id="sharpness-range" min="0" max="2" step="0.01" value="0">
                        </div>
                    </div>
                </div>
            </div>

            <div class="hud-bottom">
                <p class="note">To Do: Add presets + react<br>all266@cornell.edu</p>
                <div class="hud-actions">
                    <a class="hud-action" href="index2.html">Test Place</a>
                    <a class="hud-action" href="https://anthonyasc5.github.io/depthenginebyall/">Main Version</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const state = {
    isLidarMode: false,
    depthStrength: 100,
    contrast: 1
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 150);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* ---------- VIDEO SETUP ---------- */

const video = document.createElement('video');
video.autoplay = true;
video.muted = true;
video.playsInline = true;
video.volume = 1;

let activeTexture = new THREE.VideoTexture(video);

const cameraSelect = document.getElementById('cameraSelect');
const refreshBtn = document.getElementById('btn-refresh');

async function getCameras() {
    cameraSelect.innerHTML = '<option disabled selected>Select camera...</option>';
    const devices = await navigator.mediaDevices.enumerateDevices();
    devices.filter(d => d.kind === 'videoinput').forEach((device, i) => {
        const opt = document.createElement('option');
        opt.value = device.deviceId;
        opt.text = device.label || `Camera ${i + 1}`;
        cameraSelect.appendChild(opt);
    });
}

async function startStream(deviceId) {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: deviceId ? { exact: deviceId } : undefined }
    });
    video.muted = true;
    video.srcObject = stream;
    video.play().catch(() => {});
    activeTexture = new THREE.VideoTexture(video);
    material.uniforms.uTexture.value = activeTexture;
    video.onloadedmetadata = () => updateTexelSize(video.videoWidth, video.videoHeight);
}

refreshBtn.onclick = getCameras;
cameraSelect.onchange = e => startStream(e.target.value);

getCameras();

/* ---------- IMAGE INPUT ---------- */

const imageInput = document.getElementById('imageInput');
const dropZone = document.getElementById('drop-zone');
const videoInput = document.getElementById('videoInput');
const videoDropZone = document.getElementById('video-drop-zone');
let activeObjectUrl = null;

function setTexture(tex) {
    material.uniforms.uTexture.value = tex;
}

function updateTexelSize(width, height) {
    if (!width || !height) return;
    material.uniforms.uTexelSize.value.set(1 / width, 1 / height);
}

function clearActiveObjectUrl() {
    if (activeObjectUrl) {
        URL.revokeObjectURL(activeObjectUrl);
        activeObjectUrl = null;
    }
}

function loadImage(file) {
    if (!file || !file.type.startsWith('image/')) return;
    clearActiveObjectUrl();
    const img = new Image();
    img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.needsUpdate = true;
        setTexture(tex);
        updateTexelSize(img.width, img.height);
    };
    activeObjectUrl = URL.createObjectURL(file);
    img.src = activeObjectUrl;
}

function loadVideoFile(file) {
    if (!file || !file.type.startsWith('video/')) return;
    clearActiveObjectUrl();
    const objectUrl = URL.createObjectURL(file);
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.onloadedmetadata = () => {
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }

        activeObjectUrl = objectUrl;
        video.loop = true;
        video.muted = false;
        video.volume = 1;
        video.src = activeObjectUrl;
        video.play().catch(() => {
            alert('Click once on the page to enable audio playback.');
        });
        video.onloadedmetadata = () => updateTexelSize(video.videoWidth, video.videoHeight);
        setTexture(new THREE.VideoTexture(video));
    };
    probe.onerror = () => {
        alert('Invalid video file.');
        URL.revokeObjectURL(objectUrl);
    };
    probe.src = objectUrl;
}

if (imageInput) {
    imageInput.onchange = e => loadImage(e.target.files[0]);
}
if (videoInput) {
    videoInput.onchange = e => loadVideoFile(e.target.files[0]);
}

if (dropZone) {
    dropZone.ondragover = e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    };

    dropZone.ondragleave = () => dropZone.classList.remove('dragover');

    dropZone.ondrop = e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        loadImage(e.dataTransfer.files[0]);
    };
}

if (videoDropZone) {
    videoDropZone.ondragover = e => {
        e.preventDefault();
        videoDropZone.classList.add('dragover');
    };

    videoDropZone.ondragleave = () => videoDropZone.classList.remove('dragover');

    videoDropZone.ondrop = e => {
        e.preventDefault();
        videoDropZone.classList.remove('dragover');
        loadVideoFile(e.dataTransfer.files[0]);
    };
}

/* ---------- PARTICLES ---------- */

const width = 400, height = 300;
const count = width * height;

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
const uvs = new Float32Array(count * 2);

for (let i = 0; i < width; i++) {
    for (let j = 0; j < height; j++) {
        const id = i + j * width;
        positions[id * 3] = (i - width / 2) * 0.5;
        positions[id * 3 + 1] = (height / 2 - j) * 0.5;
        positions[id * 3 + 2] = 0;
        uvs[id * 2] = i / width;
        uvs[id * 2 + 1] = 1 - j / height;
    }
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

const material = new THREE.ShaderMaterial({
    uniforms: {
        uTexture: { value: activeTexture },
        uDepthFactor: { value: 100 },
        uDepthContrast: { value: 1 },
        uLidarMode: { value: 0 },
        uBrightness: { value: 0 },
        uImageContrast: { value: 1 },
        uSaturation: { value: 1 },
        uSharpness: { value: 0 },
        uTexelSize: { value: new THREE.Vector2(1 / width, 1 / height) }
    },
    vertexShader: `
        uniform sampler2D uTexture;
        uniform float uDepthFactor;
        uniform float uDepthContrast;
        uniform float uLidarMode;
        varying vec2 vUv;
        varying float vElevation;

        void main() {
            vUv = uv;
            vec4 c = texture2D(uTexture, uv);
            float luma = dot(c.rgb, vec3(0.299, 0.587, 0.114));
            float fakeDepth = luma * (1.0 - distance(uv, vec2(0.5)));
            float realDepth = (luma - 0.1) * uDepthContrast;
            float depth = mix(fakeDepth, realDepth, uLidarMode);
            vec3 pos = position;
            pos.z += depth * uDepthFactor;
            vElevation = depth;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = depth > 0.05 ? 2.5 : 0.0;
        }
    `,
    fragmentShader: `
        varying vec2 vUv;
        varying float vElevation;
        uniform sampler2D uTexture;
        uniform float uLidarMode;
        uniform float uBrightness;
        uniform float uImageContrast;
        uniform float uSaturation;
        uniform float uSharpness;
        uniform vec2 uTexelSize;

        vec3 applyImageAdjustments(vec2 uv) {
            vec3 center = texture2D(uTexture, uv).rgb;
            vec3 north = texture2D(uTexture, uv + vec2(0.0, uTexelSize.y)).rgb;
            vec3 south = texture2D(uTexture, uv - vec2(0.0, uTexelSize.y)).rgb;
            vec3 east = texture2D(uTexture, uv + vec2(uTexelSize.x, 0.0)).rgb;
            vec3 west = texture2D(uTexture, uv - vec2(uTexelSize.x, 0.0)).rgb;

            vec3 sharpened = center + uSharpness * (center * 4.0 - (north + south + east + west));
            vec3 color = clamp(sharpened + vec3(uBrightness), 0.0, 1.0);
            color = clamp((color - 0.5) * uImageContrast + 0.5, 0.0, 1.0);
            float luma = dot(color, vec3(0.299, 0.587, 0.114));
            color = mix(vec3(luma), color, uSaturation);
            return clamp(color, 0.0, 1.0);
        }

        void main() {
            vec3 base = applyImageAdjustments(vUv);
            vec3 heat = mix(vec3(0,0,1), vec3(1,0,0), vElevation);
            gl_FragColor = vec4(mix(base, heat, uLidarMode * 0.5), 1.0);
        }
    `,
    transparent: true
});

scene.add(new THREE.Points(geometry, material));

window.toggleMode = () => {
    state.isLidarMode = !state.isLidarMode;
    material.uniforms.uLidarMode.value = state.isLidarMode ? 1 : 0;
    const btn = document.getElementById('btn-mode');
    btn.textContent = state.isLidarMode
        ? 'Mode: Lidar / Depth Map'
        : 'Mode: Simulation (Light)';
    btn.classList.toggle('active', state.isLidarMode);
};

document.getElementById('depth-range').oninput = e =>
    material.uniforms.uDepthFactor.value = Number(e.target.value);

document.getElementById('contrast-range').oninput = e =>
    material.uniforms.uDepthContrast.value = Number(e.target.value);

const filterBtn = document.getElementById('btn-filters');
const filterPanel = document.getElementById('filter-panel');

filterBtn.onclick = () => {
    const isOpen = filterPanel.classList.toggle('open');
    filterBtn.textContent = isOpen ? 'Filters v' : 'Filters >';
};

document.getElementById('brightness-range').oninput = e =>
    material.uniforms.uBrightness.value = Number(e.target.value);

document.getElementById('image-contrast-range').oninput = e =>
    material.uniforms.uImageContrast.value = Number(e.target.value);

document.getElementById('saturation-range').oninput = e =>
    material.uniforms.uSaturation.value = Number(e.target.value);

document.getElementById('sharpness-range').oninput = e =>
    material.uniforms.uSharpness.value = Number(e.target.value);

function setRangeFill(input) {
    const min = Number(input.min || 0);
    const max = Number(input.max || 100);
    const value = Number(input.value || 0);
    const pct = max > min ? ((value - min) / (max - min)) * 100 : 0;
    input.style.setProperty('--fill', `${pct}%`);
}

const allRanges = document.querySelectorAll('input[type="range"]');
allRanges.forEach(input => {
    setRangeFill(input);
    input.addEventListener('input', () => setRangeFill(input));
});

const tabButtons = document.querySelectorAll('.tab-btn');
const modulePanels = document.querySelectorAll('.module-panel');

tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        tabButtons.forEach(other => other.classList.remove('active'));
        modulePanels.forEach(panel => panel.classList.remove('active'));
        btn.classList.add('active');
        const targetPanel = document.getElementById(targetId);
        if (targetPanel) targetPanel.classList.add('active');
    });
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.onresize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
};
</script>

</body>
</html>
